<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

<body>
<main class="nf">
  <h1 class="sr">404</h1>
  <div class="nf-ascii" id="ascii" aria-hidden="true"></div>
  <div class="nf-txt">
    <p class="nf-h"><span data-en="Page not found" data-cs="Stránka nenalezena">Stránka nenalezena</span><span data-en="The page you are looking for doesn’t exist or has moved." data-cs="Hledaná stránka neexistuje nebo se přesunula.">Hledaná stránka neexistuje nebo se přesunula.</span></p>

<script>
/* ═══════════════════════════════════════════════════════════
   404 из символов, как портрет в hero: цифры рисуются на холсте
   шрифтом сайта, ascii.js раскладывает их на знаки, знаки текут,
   от курсора расходится волна. Размер считается под экран;
   при заметной смене пропорций картинка собирается заново.
   ═══════════════════════════════════════════════════════════ */
var LANG = 'cs';
try { LANG = window.__LANGQ || localStorage.getItem('lang') || 'cs'; } catch (e) {}
document.documentElement.lang = LANG; document.documentElement.setAttribute('data-lang', LANG);
document.querySelectorAll('[data-en]').forEach(function (el) { var v = el.getAttribute('data-' + LANG); if (v) el.textContent = v; });
window.setLang = function () {};

var host = document.getElementById('ascii'), SRC = null, RATIO = 1, lastH = 0;
/* «404»: светлая заливка сверху вниз гаснет к краям, мягкое свечение даёт редкие точки по контуру */
function render() {
  var fs = 600, c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = fs * 3; c.height = fs * 1.5;
  x.font = '800 ' + fs + 'px "Inter Tight", Arial, sans-serif'; x.textBaseline = 'middle'; x.textAlign = 'center';
  try { x.letterSpacing = '-' + Math.round(fs * .03) + 'px'; } catch (e) {}
  var g = x.createLinearGradient(0, fs * .35, 0, fs * 1.15);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#dcdcdc'); g.addColorStop(1, '#9a9a9a');
  x.fillStyle = g; x.shadowColor = 'rgba(255,255,255,.5)'; x.shadowBlur = fs * .05;
  x.fillText('404', c.width / 2, c.height / 2);
  /* обрезаем по самим знакам (со свечением), чтобы цифры стояли ровно по центру */
  var d = x.getImageData(0, 0, c.width, c.height).data, x0 = c.width, x1 = 0, y0 = c.height, y1 = 0, i, j;
  for (j = 0; j < c.height; j += 2) for (i = 0; i < c.width; i += 2) if (d[(j * c.width + i) * 4 + 3] > 24) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
  var pad = fs * .04, o = document.createElement('canvas');
  o.width = Math.ceil(x1 - x0 + pad * 2); o.height = Math.ceil(y1 - y0 + pad * 2);
  var ox = o.getContext('2d', { willReadFrequently: true });
  ox.drawImage(c, x0 - pad, y0 - pad, o.width, o.height, 0, 0, o.width, o.height);
  /* мягкий шум, как светотень на портрете: знаки получаются разной плотности, а не сплошные «@» */
  var nz = document.createElement('canvas'), nx = nz.getContext('2d', { willReadFrequently: true });
  nz.width = 48; nz.height = Math.max(8, Math.round(48 / (o.width / o.height)));
  var nd = nx.createImageData(nz.width, nz.height);
  for (i = 0; i < nd.data.length; i += 4) { nd.data[i] = nd.data[i + 1] = nd.data[i + 2] = 255 * Math.random(); nd.data[i + 3] = 255; }
  nx.putImageData(nd, 0, 0);
  var big = document.createElement('canvas'), bx = big.getContext('2d', { willReadFrequently: true });
  big.width = o.width; big.height = o.height; bx.imageSmoothingQuality = 'high'; bx.drawImage(nz, 0, 0, o.width, o.height);
  var N = bx.getImageData(0, 0, o.width, o.height).data, im = ox.getImageData(0, 0, o.width, o.height), D = im.data;
  for (i = 0; i < D.length; i += 4) { var k = .5 + .5 * (N[i] / 255); D[i] *= k; D[i + 1] *= k; D[i + 2] *= k; }
  ox.putImageData(im, 0, 0);
  RATIO = o.width / o.height;
  return o.toDataURL('image/png');
}
function size() {
  var W = innerWidth, H = innerHeight, phone = W < 768;
  var h = Math.min(phone ? .3 : .5, (W * (phone ? .9 : .8) / RATIO) / H);   // по ширине экрана, но не выше доли высоты
  var mid = phone ? .4 : .42;                                                  // центр цифр чуть выше середины, снизу текст
  return { h: h, at: [.5, mid + h / 2], fs: phone ? 5 : (W > 1600 ? 7 : 6) };
}
function mount() {
  var s = size();
  if (!(s.h > 0) || !isFinite(s.h)) return;   // окно ещё без размера (фоновая вкладка): соберём на первом resize
  lastH = s.h;
  var old = host.querySelector('canvas');
  if (old) { try { var gl = old.getContext('webgl'); gl && gl.getExtension('WEBGL_lose_context') && gl.getExtension('WEBGL_lose_context').loseContext(); } catch (e) {} }
  var el = document.createElement('div'); el.className = 'nf-ascii'; el.setAttribute('aria-hidden', 'true'); el.id = 'ascii';
  el.setAttribute('data-ascii', JSON.stringify({
    src: SRC, height: s.h, at: s.at, focus: [.5, .5], fontSize: s.fs, chars: ' .`:-~=+*cxoO#%@',
    contrast: 1.25, brightnessBoost: 1.05, posterize: 48, threshold: .05, fade: .02,
    colors: ['#8a2a12', '#ff6a3d'], flowStrength: 3, mouseStrength: 18, mouseRadius: 190
  }));
  host.replaceWith(el); host = el;
  if (window.AsciiMount) { AsciiMount(el); el.removeAttribute('data-ascii'); }   // иначе boot() из ascii.js соберёт его второй раз
  (function on(n) { var cv = el.querySelector('canvas'); if (cv && el._ascii) el._ascii.ready(function () { requestAnimationFrame(function () { el.classList.add('is-on'); }); }); else if (n < 60) setTimeout(function () { on(n + 1); }, 50); })(0);
}
var rt = 0;
addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () { var s = size(); if (!(lastH > 0) || Math.abs(s.h - lastH) / lastH > .12) mount(); }, 250);
});
function go() { if (SRC) return; SRC = render(); mount(); }
(document.fonts && document.fonts.load ? document.fonts.load('800 100px "Inter Tight"', '404') : Promise.resolve()).then(go, go);
setTimeout(go, 1500);
</script>
